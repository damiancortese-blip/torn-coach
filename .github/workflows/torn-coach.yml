name: torn-coach

# Corre el bot de avisos cada ~5 minutos (el minimo que permite GitHub Actions).
# Es de solo lectura: lee tu cuenta de Torn y te avisa. No hace acciones en el juego.
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: torn-coach
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: torn-state-${{ github.run_id }}
          restore-keys: torn-state-

      - name: Correr el bot (una pasada)
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          STATE_FILE: state.json
          TRAIN_STAT: strength
          AP_SET: ${{ vars.AP_SET }}
        run: python3 torn_coach.py --once

      - name: Guardar estado
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: torn-state-${{ github.run_id }}
